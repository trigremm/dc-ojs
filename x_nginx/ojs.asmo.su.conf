# /etc/nginx/sites-available/ojs.asmo.su.conf
# HTTP-only vhost. The 443 server block and HTTP->HTTPS redirect are added
# by `certbot --nginx --redirect` on first deploy (see makefile_nginx.mk).

server {
    listen 80;
    listen [::]:80;
    server_name ojs.asmo.su;

    # ACME challenge (webroot fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Must match / exceed PHP upload_max_filesize + post_max_size in config/php.custom.ini
    client_max_body_size 128M;

    # Security headers (complement Apache-level ones)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/ojs.asmo.su.access.log;
    error_log  /var/log/nginx/ojs.asmo.su.error.log;

    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
