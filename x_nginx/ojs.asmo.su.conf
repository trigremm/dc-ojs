# /etc/nginx/sites-available/ojs.asmo.su.conf
# Symlink to /etc/nginx/sites-enabled/ojs.asmo.su.conf and reload nginx.
#
# Prerequisites:
#   certbot certonly --nginx -d ojs.asmo.su

server {
    listen 80;
    listen [::]:80;
    server_name ojs.asmo.su;

    # ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ojs.asmo.su;

    ssl_certificate     /etc/letsencrypt/live/ojs.asmo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ojs.asmo.su/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Must match / exceed PHP upload_max_filesize + post_max_size in config/php.custom.ini
    client_max_body_size 128M;

    # Security headers (complement Apache-level ones)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/ojs.asmo.su.access.log;
    error_log  /var/log/nginx/ojs.asmo.su.error.log;

    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
