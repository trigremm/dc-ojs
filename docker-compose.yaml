services:
  db:
    image: mariadb:11.8
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${OJS_DB_ROOT_PASSWORD:?OJS_DB_ROOT_PASSWORD must be set in .env}"
      MYSQL_DATABASE: "${OJS_DB_NAME:?OJS_DB_NAME must be set in .env}"
      MYSQL_USER: "${OJS_DB_USER:?OJS_DB_USER must be set in .env}"
      MYSQL_PASSWORD: "${OJS_DB_PASSWORD:?OJS_DB_PASSWORD must be set in .env}"
    restart: always
    volumes:
      - ./.docker_volumes/db:/var/lib/mysql
      - ./config/db.charset.conf:/etc/mysql/conf.d/charset.cnf
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  ojs:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DC_OJS_HTTP_PORT:-8060}:80"
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./.docker_volumes/html:/var/www/html
      - ./.docker_volumes/private:/var/www/files
      - ./.docker_volumes/apache_logs:/var/log/apache2
      - ./config/php.custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
