; Custom PHP settings for OJS
upload_max_filesize = 64M
post_max_size = 128M
max_execution_time = 300
memory_limit = 512M
date.timezone = "Asia/Almaty"

; Security hardening
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
session.cookie_httponly = 1
session.use_strict_mode = 1

; Error logging to container stderr (visible via docker logs)
log_errors = On
error_log = /proc/self/fd/2

; OPcache — big perf boost for OJS
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=0 skips per-request file stat checks for max production
; throughput — but OPcache then never notices changed PHP files on disk. After
; ANY OJS code change or upgrade (e.g. `make ojs-upgrade`), reset OPcache with:
;   make ojs-cache-clear   # clears OJS's on-disk template/compile cache
; then restart the ojs container (`make r`) to flush the in-memory OPcache.
opcache.validate_timestamps = 0
; Inert while validate_timestamps=0; only consulted when timestamps are validated.
opcache.revalidate_freq = 2
